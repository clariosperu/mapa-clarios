<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAP Clarios — Mapa real</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ink:#14181a; --ink-2:#4d565c; --ink-3:#838f96;
    --surface:#fff; --surface-2:#f5f6f7; --border:#dde1e3;
    --accent:#202495; --accent-bg:#e5e6f7;
    --verde:#1a8a4a; --verde-bg:#e2f5e9;
    --rojo:#d3273e; --rojo-bg:#fbe6e9;
    --gris:#5b6570; --gris-bg:#e7e9eb;
    --azul:#2563eb; --azul-bg:#e5edfd;
    --shadow:0 1px 2px rgba(20,22,30,.08), 0 1px 1px rgba(20,22,30,.05);
    --shadow-lg:0 12px 32px rgba(20,22,30,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--surface-2); color:var(--ink);}
  #app{display:flex; flex-direction:column; height:100%;}
  header{padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; z-index:1000;}
  header h1{font-size:15px; margin:0; font-weight:800; white-space:nowrap;}
  header .sub{font-size:11.5px; color:var(--ink-3); white-space:nowrap;}
  .search-box{flex:1; min-width:160px; position:relative;}
  #search{width:100%; padding:8px 12px; border-radius:18px; border:1px solid var(--border); font-size:13px; background:var(--surface-2); color:var(--ink);}
  #search-results{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); max-height:260px; overflow-y:auto; z-index:1001;}
  #search-results .sri{display:flex; gap:8px; align-items:center; padding:8px 11px; cursor:pointer; border-bottom:1px solid var(--border); font-size:12.5px;}
  #search-results .sri:last-child{border-bottom:none;}
  #search-results .sri:hover{background:var(--surface-2);}
  #search-results .sri .d{width:9px;height:9px;border-radius:50%;flex:none;}
  #btn-geo{flex:none; width:36px;height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--accent); display:flex; align-items:center; justify-content:center;}
  #btn-geo.on{background:var(--accent); color:#fff;}
  #filters{padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; gap:6px; overflow-x:auto; z-index:999;}
  .chip{flex:none; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); cursor:pointer; white-space:nowrap;}
  .chip b{font-weight:800; opacity:.7; margin-left:4px;}
  .chip.active{color:#fff;}
  .chip[data-f="todos"].active{background:var(--accent); border-color:var(--accent);}
  .chip[data-f="activo"].active{background:var(--verde); border-color:var(--verde);}
  .chip[data-f="recuperar"].active{background:var(--rojo); border-color:var(--rojo);}
  .chip[data-f="negro"].active{background:#111111; border-color:#111111;}
  .gmap-pin{background:none; border:none;}
  /* Punto de "mi ubicación" tipo Google Maps: círculo azul fijo + anillo que
     parpadea/se expande (pedido explícito del usuario, 2026-09-15) para que
     el vendedor se ubique en el mapa cuando su GPS está activo. */
  .gps-marker{position:relative; width:16px; height:16px;}
  .gps-dot{position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; background:var(--accent); border:2px solid #fff; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.4); z-index:2;}
  .gps-pulse{position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; background:var(--accent); opacity:.5; border-radius:50%; z-index:1; animation:gpsPulse 1.8s ease-out infinite;}
  @keyframes gpsPulse{
    0%{transform:scale(1); opacity:.55;}
    100%{transform:scale(3.4); opacity:0;}
  }
  #map{flex:1; min-height:0; position:relative;}
  /* Card del pin rediseñado (pedido explícito del usuario, 2026-09-15):
     estilo moderno tipo CRM/Salesforce — 340-360px en desktop, 100% del
     ancho disponible en mobile, fondo blanco semitransparente, esquinas
     redondeadas de 12px y sombra suave. Ver bindPopup() para maxWidth. */
  .leaflet-popup-content-wrapper{
    background:rgba(255,255,255,.97);
    border-radius:15px;
    border:2.5px solid var(--accent);
    box-shadow:0 6.5px 16.5px rgba(20,22,30,.16), 0 1.1px 2.2px rgba(20,22,30,.08);
    padding:0;
  }
  .leaflet-popup-tip{background:rgba(255,255,255,.97);}
  .leaflet-popup-content{
    margin:8.1px 9.2px;
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    width:auto !important;
    min-width:138px;
    max-width:175px;
  }
  @media (max-width:480px){
    .leaflet-popup-content{ min-width:calc(46.8vw - 17.6px); max-width:calc(46.8vw - 17.6px); }
  }
  .pop-code{color:#000; font-weight:600;}
  .pop-name{font-weight:600; font-size:8px; color:#000; line-height:1.3; margin-bottom:6px; letter-spacing:-.005em;}
  .pop-badge{display:inline-block; font-size:6.3px; font-weight:600; letter-spacing:.02em; padding:1.3px 5.1px; border-radius:10px; margin-bottom:5px; color:#000 !important;}
  .pop-address{font-size:6.3px; color:#000; line-height:1.4; margin-bottom:6.3px; font-weight:400;}
  .pop-divider{border:none; border-top:1px solid #e7e9eb; margin:5px 0;}
  .pop-status-row{display:flex; align-items:center; gap:3.9px; flex-wrap:wrap;}
  .pop-date-badge{display:inline-flex; align-items:center; gap:2.5px; background:rgba(59,130,246,.15); color:#000; font-weight:600; font-size:6.3px; padding:2.5px 5.1px; border-radius:5px; white-space:nowrap;}
  .pop-date-badge svg{flex:none;}
  .pop-status-sep{width:1px; align-self:stretch; background:#dde1e3;}
  .pop-days{display:inline-flex; align-items:center; gap:2.5px; font-size:6.3px; color:#000; font-weight:500; white-space:nowrap;}
  .pop-days svg{flex:none; color:#d97706;}
  .pop-section-title{display:flex; align-items:center; gap:3.9px; font-size:5.7px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#000; margin-bottom:5px;}
  .pop-section-title .ic-chart{color:#2563eb; flex:none;}
  .pop-section-title .ic-batt{flex:none; width:10px; height:10px; border-radius:2.5px; background:#16a34a; display:inline-flex; align-items:center; justify-content:center; color:#fff;}
  .pop-hist-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:2.5px; margin-bottom:1.3px;}
  .pop-hist-card{background:#fff; border:1px solid #dbe4f5; border-radius:5px; padding:3.9px 1.9px; text-align:center;}
  .pop-hist-card .mh-mes{font-size:5.1px; font-weight:600; color:#000; text-transform:capitalize; letter-spacing:.02em;}
  .pop-hist-card .mh-und{font-size:7.6px; font-weight:700; color:#000; margin-top:1.3px;}
  .pop-prods{margin-top:0.7px;}
  .pop-prod-row{display:flex; justify-content:space-between; align-items:center; gap:3.9px; font-size:6.3px; padding:2.5px 0; color:#000; min-width:0; border-bottom:1px solid #f0f1f2; font-weight:400;}
  .pop-prod-row:last-child{border-bottom:none;}
  .pop-prod-row span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .pop-prod-row b{color:#000; font-weight:600; flex:none; white-space:nowrap;}
  .pop-prod-row.top span,.pop-prod-row.top b{font-weight:700; color:#000;}
  .pop-approx{display:flex; align-items:center; gap:3.9px; font-size:6.3px; color:#000; background:var(--surface-2); border-radius:3.9px; padding:3.9px 5.1px; margin-top:1.3px; line-height:1.35; font-weight:400;}
  .pop-actions{display:flex; flex-direction:column; gap:2.5px; margin-top:1.3px;}
  .pop-btn{display:flex; align-items:center; justify-content:center; gap:3.9px; text-align:center; padding:5.1px 2.5px; border-radius:5px; border:1px solid #e5e7eb; background:#f5f6f7; color:#000; font-size:6.3px; font-weight:600; text-decoration:none; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pop-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-size:6.9px;}
  .pop-btn.secondary{padding:3.9px 2.5px; font-size:6.3px; background:none; border:none; color:#000;}
  .pop-visit{display:block; width:100%; margin-top:3.9px; padding:3.9px; border-radius:5px; border:1px dashed var(--border); background:none; font-size:6.3px; font-weight:600; color:#000; cursor:pointer; text-align:center;}
  .pop-visit.on{border-style:solid; border-color:var(--azul); color:#000; background:var(--azul-bg);}
  #map-banner{position:absolute; top:10px; left:50%; transform:translateX(-50%); max-width:min(480px,92%); background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:10px; padding:9px 13px; font-size:12px; color:var(--ink-2); box-shadow:var(--shadow-lg); z-index:1002; line-height:1.5;}
  #map-banner.error{border-left-color:var(--rojo); color:var(--ink);}
  #map-banner button{display:block; margin:8px auto 0; padding:6px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-size:11.5px; font-weight:700; cursor:pointer;}
  #map-banner.error button{border-color:var(--rojo); background:var(--rojo);}
  #footer-note{background:var(--surface); border-top:1px solid var(--border); padding:7px 14px; font-size:11px; color:var(--ink-3); text-align:center;}
  #footer-note a{color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MAP Clarios</h1>
    <span class="sub" id="hdr-count"></span>
    <div class="search-box">
      <input type="text" id="search" placeholder="Buscar cliente o RUC..." autocomplete="off">
      <div id="search-results" hidden></div>
    </div>
    <button id="btn-geo" title="Mi ubicación">◎</button>
  </header>
  <div id="filters">
    <button class="chip active" data-f="todos">Todos <b id="c-todos"></b></button>
    <button class="chip" data-f="activo">🟢 Activos <b id="c-activo"></b></button>
    <button class="chip" data-f="recuperar">🔴 Recupero 1 (5-12 meses) <b id="c-recuperar"></b></button>
    <button class="chip" data-f="negro">⚫ Recupero 2 (+12 meses) <b id="c-negro"></b></button>
  </div>
  <div id="map"><div id="map-banner" hidden></div></div>
  <div id="footer-note">Mapa real (OpenStreetMap) — archivo independiente, sin integración con Cotizador/C&amp;C. Para cotizar o ver cartera, abre el Catálogo Clarios y busca al cliente por RUC.</div>
</div>

<script>
(function(){
  var CLIENTES = JSON.parse(document.getElementById('clientes-map-data').textContent);
  var VISITA_DIAS = 21;

  function getVisitas(){ try{ return JSON.parse(localStorage.getItem('map_real_visitas')||'{}'); }catch(e){ return {}; } }
  function setVisitas(v){ try{ localStorage.setItem('map_real_visitas', JSON.stringify(v)); }catch(e){} }
  function estaVisitado(id){
    var v = getVisitas()[id];
    if(!v) return false;
    var dias = Math.round((Date.now()-new Date(v).getTime())/86400000);
    return dias>=0 && dias<=VISITA_DIAS;
  }
  function marcarVisitado(id){ var v=getVisitas(); v[id]=new Date().toISOString(); setVisitas(v); }
  function desmarcarVisitado(id){ var v=getVisitas(); delete v[id]; setVisitas(v); }
  // Esquema de color redefinido por el usuario (2026-09-14): ahora es
  // puramente por recencia de compra (4 bandas), ya no hay una marca de
  // "visitado" independiente (ver nota en popupHtml). Los clientes sin
  // ninguna compra histórica se agrupan en "negro" junto con los de +13
  // meses sin comprar.
  function estadoFinal(c){ return c.estado; }

  var COLOR = { activo:'#1a8a4a', recuperar:'#d3273e', negro:'#111111' };
  var LABEL = { activo:'Activo', recuperar:'Recupero 1 (5-12 meses)', negro:'Recupero 2 (+12 meses)' };

  // Pin estilo Google Maps (gota con punta hacia abajo), coloreado según el
  // estado del cliente — pedido explícito del usuario: "debe verse como
  // Google Maps", no círculos planos.
  function pinIcon(color){
    var svg = '<svg width="12.6" height="18" viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" fill="'+color+'" stroke="#fff" stroke-width="2"/>'+
      '<circle cx="14" cy="14.5" r="5.5" fill="#fff"/>'+
      '</svg>';
    return L.divIcon({
      className: 'gmap-pin',
      html: svg,
      iconSize: [12.6,18],
      iconAnchor: [6.3,18],
      popupAnchor: [0,-16.2],
    });
  }

  document.getElementById('hdr-count').textContent = CLIENTES.length + ' clientes geolocalizados';

  var map = L.map('map', { zoomControl:true }).setView([-9.2, -75.0], 6);

  // El fondo del mapa (los "tiles") se pide a un servidor externo por cada
  // pedazo visible — si la red/firewall del equipo bloquea ese dominio, esas
  // imágenes no cargan aunque el resto de la página (pines, filtros, ficha)
  // funcione perfecto, porque eso sí está embebido en el archivo. Por eso se
  // prueban varios proveedores en cadena — si el primero falla, se pasa
  // automáticamente al siguiente — y si todos fallan se avisa en pantalla
  // en vez de dejar un fondo gris sin explicación.
  // Los servidores de OpenStreetMap (y sus espejos Wikimedia/.de/.fr) ahora
  // exigen que la app cumpla su política de uso (operations.osmfoundation.org/
  // policies/tiles/) y, si no, devuelven una imagen "Access blocked" en vez de
  // la calle — no es un error de red, por eso no se detectaba antes. Se usan
  // en su lugar dos proveedores gratuitos sin este requisito: Esri (mapa de
  // calles) y OpenTopoMap como respaldo.
  var TILE_PROVIDERS = [
    { name:'Esri World Street Map', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      attribution:'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom' },
    { name:'OpenTopoMap',           url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      attribution:'Map data: &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC-BY-SA</a>)' },
  ];
  var providerIdx = -1;
  var currentTileLayer = null;
  var tileErrorCount = 0;
  var tileLoadedOk = false;
  var providerTimer = null;

  function showMapBanner(html, isError){
    var b = document.getElementById('map-banner');
    b.innerHTML = html;
    b.className = isError ? 'error' : '';
    b.hidden = false;
  }
  function hideMapBanner(){
    document.getElementById('map-banner').hidden = true;
  }

  function tryNextProvider(){
    providerIdx++;
    if(currentTileLayer){ map.removeLayer(currentTileLayer); }
    if(providerTimer){ clearTimeout(providerTimer); }
    if(providerIdx >= TILE_PROVIDERS.length){
      showMapBanner(
        '⚠️ No se pudo cargar el fondo del mapa (se probaron '+TILE_PROVIDERS.length+' proveedores). '+
        'Los clientes SÍ están ubicados correctamente — es la imagen de calles la que no llega. '+
        'Muy probablemente tu red o firewall corporativo está bloqueando esos dominios. '+
        'Prueba abrir este mismo archivo desde otra red (datos móviles, por ejemplo), o pide a Sistemas que habilite acceso a *.arcgisonline.com y *.opentopomap.org. '+
        '<button type="button" id="map-banner-retry">Reintentar</button>',
        true
      );
      return;
    }
    tileErrorCount = 0;
    tileLoadedOk = false;
    var p = TILE_PROVIDERS[providerIdx];
    showMapBanner('Cargando el mapa de fondo… (' + p.name + ')', false);
    currentTileLayer = L.tileLayer(p.url, { maxZoom: 19, attribution: p.attribution });
    currentTileLayer.on('tileload', function(){
      tileLoadedOk = true;
      hideMapBanner();
      if(providerTimer){ clearTimeout(providerTimer); }
    });
    currentTileLayer.on('tileerror', function(){
      tileErrorCount++;
      if(tileErrorCount >= 6 && !tileLoadedOk) tryNextProvider();
    });
    currentTileLayer.addTo(map);
    // Si en 5s no cargó NI una tile y tampoco hubo errores (algunas redes
    // simplemente cuelgan la conexión en vez de devolver un error), se pasa
    // igual al siguiente proveedor.
    providerTimer = setTimeout(function(){
      if(!tileLoadedOk) tryNextProvider();
    }, 5000);
  }
  document.addEventListener('click', function(e){
    if(e.target && e.target.id==='map-banner-retry'){
      providerIdx = -1;
      tryNextProvider();
    }
  });
  tryNextProvider();

  // Leyenda de colores quitada del mapa (pedido explícito del usuario,
  // 2026-09-15). El código de colores (verde/rojo/negro) sigue disponible
  // en los chips de filtro de arriba, que ya incluyen las mismas etiquetas.

  var markersById = {};
  var layerGroup = L.layerGroup().addTo(map);
  var currentFilter = 'todos';
  var bounds = [];

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtMonto(n){
    if(n==null) return '—';
    return 'S/ '+Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  var ICO_CAL = '<svg width="7.6" height="7.6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
  var ICO_CLOCK = '<svg width="7.6" height="7.6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
  var ICO_CHART = '<svg class="ic-chart" width="7.6" height="7.6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>';
  var ICO_BATT = '<span class="ic-batt"><svg width="6.3" height="6.3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4M8 12h4M10 10v4"/></svg></span>';
  var ICO_PIN_W = '<svg width="7.6" height="7.6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 10.8A2.8 2.8 0 1 1 12 7.2a2.8 2.8 0 0 1 0 5.6z"/></svg>';
  var ICO_PIN_G = '<svg width="6.3" height="6.3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 10.8A2.8 2.8 0 1 1 12 7.2a2.8 2.8 0 0 1 0 5.6z"/></svg>';

  function historialHtml(c){
    var h = c.historialMensual || [];
    if(!h.length) return '';
    return '<div class="pop-divider"></div>'+
      '<div class="pop-section-title">'+ICO_CHART+'Historial de compras (baterías)</div>'+
      '<div class="pop-hist-grid">'+h.map(function(x){
        var mes = esc(x.mes);
        mes = mes.charAt(0).toUpperCase()+mes.slice(1).toLowerCase();
        return '<div class="pop-hist-card"><div class="mh-mes">'+mes+'</div><div class="mh-und">'+Math.round(x.unidades)+'</div></div>';
      }).join('')+'</div>';
  }
  function productosHtml(c){
    // Modelo real tomado de la columna AX ("MODELO") de BD VENTAS APP WEB,
    // agrupado por cliente (RUC) y sumado por cantidad total de baterías.
    var top = (c.topModelos||[]).slice(0,5);
    if(!top.length) return '';
    return '<div class="pop-divider"></div>'+
      '<div class="pop-section-title">'+ICO_BATT+'Modelos más comprados</div>'+
      '<div class="pop-prods">'+top.map(function(p,i){
        return '<div class="pop-prod-row'+(i===0?' top':'')+'"><span>'+esc(p.modelo)+'</span><b>'+(p.unidades!=null?Math.round(p.unidades):'—')+'</b></div>';
      }).join('')+
      '</div>';
  }
  function popupHtml(c){
    var est = estadoFinal(c);
    var fechaTxt = c.ultimaCompraFecha ? c.ultimaCompraFecha.split('-').reverse().join('/') : null;
    var diasTxt = c.dias==null ? 'Sin compras registradas' : (c.dias+' días sin comprar');
    var direccionTxt = [c.direccion, c.distrito].filter(Boolean).join(', ');
    return ''+
      '<div class="pop-name"><span class="pop-code">'+esc(c.id)+' -</span> '+esc(c.nombre)+'</div>'+
      (direccionTxt ? '<div class="pop-address">'+esc(direccionTxt)+'</div>' : '')+
      '<div class="pop-divider"></div>'+
      '<div class="pop-status-row">'+
        (fechaTxt ? '<span class="pop-date-badge">'+ICO_CAL+'Última compra: '+fechaTxt+'</span>' : '')+
        (fechaTxt ? '<span class="pop-status-sep"></span>' : '')+
        '<span class="pop-days">'+ICO_CLOCK+diasTxt+'</span>'+
      '</div>'+
      historialHtml(c)+
      productosHtml(c)+
      (c.geoNivel==='distrito' ? '<div class="pop-divider"></div><div class="pop-approx">'+ICO_PIN_G+' Ubicación aproximada (centro del distrito, no dirección exacta)</div>' : '')+
      '<div class="pop-divider"></div>'+
      '<div class="pop-actions">'+
        '<a class="pop-btn primary" href="https://maps.google.com/?q='+c.lat+','+c.lon+'" target="_blank" rel="noopener">'+ICO_PIN_W+'Google Maps</a>'+
      '</div>'+
      '';
    // Botón "Marcar como visitado hoy" omitido por el momento (pedido
    // explícito del usuario, 2026-09-14): sin verificación de ubicación
    // real, cualquiera podía marcar todo sin haber visitado nada. Las
    // funciones getVisitas/marcarVisitado/desmarcarVisitado/estaVisitado
    // se dejan intactas (aunque ya no forman parte del color/estado, que
    // ahora es puramente por recencia de compra) para poder reactivar la
    // marca de visitas más adelante con una verificación
    // real (por ejemplo, por cercanía GPS).
  }

  CLIENTES.forEach(function(c){
    var est = estadoFinal(c);
    var m = L.marker([c.lat, c.lon], { icon: pinIcon(COLOR[est]) });
    m.bindPopup(popupHtml(c), { maxWidth: 183, minWidth: 142, autoPanPadding: [24,24], className: 'pop-est-'+estadoFinal(c) });
    markersById[c.id] = m;
    bounds.push([c.lat, c.lon]);
  });

  function refreshMarker(c){
    var est = estadoFinal(c);
    var m = markersById[c.id];
    m.setIcon(pinIcon(COLOR[est]));
  }

  function applyFilter(){
    layerGroup.clearLayers();
    CLIENTES.forEach(function(c){
      var est = estadoFinal(c);
      if(currentFilter!=='todos' && est!==currentFilter) return;
      layerGroup.addLayer(markersById[c.id]);
    });
    updateCounts();
  }
  function updateCounts(){
    var counts = { todos:CLIENTES.length, activo:0, recuperar:0, negro:0 };
    CLIENTES.forEach(function(c){ counts[estadoFinal(c)]++; });
    ['todos','activo','recuperar','negro'].forEach(function(k){
      var el = document.getElementById('c-'+k);
      if(el) el.textContent = counts[k];
    });
  }

  if(bounds.length) map.fitBounds(bounds, { padding:[30,30] });
  applyFilter();

  document.getElementById('filters').addEventListener('click', function(e){
    var btn = e.target.closest('.chip[data-f]');
    if(!btn) return;
    currentFilter = btn.dataset.f;
    document.querySelectorAll('.chip').forEach(function(b){ b.classList.toggle('active', b===btn); });
    applyFilter();
  });

  // "Mi ubicación" en modo seguimiento continuo (pedido explícito del
  // usuario, 2026-09-15): mientras el botón está activo, el GPS del
  // vendedor se sigue en vivo (watchPosition, no una sola lectura) y su
  // posición se dibuja como un punto azul con un anillo que parpadea/se
  // expande, igual que el "estás aquí" de Google Maps — así el vendedor
  // puede ubicarse en el mapa respecto a sus clientes. Un segundo click
  // apaga el seguimiento (ahorra batería) y quita el punto.
  var geoWatchId = null;
  var geoMarker = null;
  function geoIcon(){
    return L.divIcon({
      className: 'gps-icon-wrap',
      html: '<div class="gps-marker"><div class="gps-pulse"></div><div class="gps-dot"></div></div>',
      iconSize: [16,16],
      iconAnchor: [8,8],
    });
  }
  document.getElementById('btn-geo').addEventListener('click', function(){
    var btn = document.getElementById('btn-geo');
    if(geoWatchId!==null){
      navigator.geolocation.clearWatch(geoWatchId);
      geoWatchId = null;
      if(geoMarker){ map.removeLayer(geoMarker); geoMarker = null; }
      btn.classList.remove('on');
      return;
    }
    if(!navigator.geolocation){ alert('Este dispositivo no permite compartir ubicación.'); return; }
    var isFirstFix = true;
    geoWatchId = navigator.geolocation.watchPosition(function(pos){
      var latlng = [pos.coords.latitude, pos.coords.longitude];
      if(!geoMarker){
        geoMarker = L.marker(latlng, { icon: geoIcon(), zIndexOffset: 1000, interactive:false }).addTo(map);
      } else {
        geoMarker.setLatLng(latlng);
      }
      if(isFirstFix){ map.setView(latlng, 14); isFirstFix = false; }
      btn.classList.add('on');
    }, function(){
      alert('No se pudo obtener tu ubicación. Revisa el permiso del navegador.');
      btn.classList.remove('on');
      geoWatchId = null;
    }, { enableHighAccuracy:true, timeout:10000, maximumAge:5000 });
  });

  var searchInput = document.getElementById('search');
  var searchResults = document.getElementById('search-results');
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    if(q.length<2){ searchResults.hidden=true; return; }
    var matches = CLIENTES.filter(function(c){
      return (c.nombre&&c.nombre.toLowerCase().indexOf(q)>-1) || (c.ruc&&c.ruc.indexOf(q)>-1);
    }).slice(0,20);
    searchResults.innerHTML = !matches.length
      ? '<div class="sri" style="color:#838f96;">Sin resultados</div>'
      : matches.map(function(c){
          var est = estadoFinal(c);
          return '<div class="sri" data-sid="'+esc(c.id)+'"><span class="d" style="background:'+COLOR[est]+'"></span>'+
            '<span>'+esc(c.nombre)+'<br><span style="color:#838f96;">'+esc(c.distrito||'—')+' · '+LABEL[est]+'</span></span></div>';
        }).join('');
    searchResults.hidden = false;
  });
  searchResults.addEventListener('click', function(e){
    var item = e.target.closest('.sri[data-sid]');
    if(!item) return;
    var c = CLIENTES.find(function(x){ return x.id===item.dataset.sid; });
    if(c){
      map.setView([c.lat,c.lon], 15);
      markersById[c.id].openPopup();
    }
    searchResults.hidden = true;
    searchInput.value = '';
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.search-box')) searchResults.hidden = true;
  });
})();
</script>
</body>
</html>
