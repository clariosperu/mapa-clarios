<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAP Clarios — Mapa real</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#14181a; --ink-2:#4d565c; --ink-3:#838f96;
    --surface:#fff; --surface-2:#f5f6f7; --border:#dde1e3;
    --accent:#202495; --accent-bg:#e5e6f7;
    --verde:#1a8a4a; --verde-bg:#e2f5e9;
    --rojo:#d3273e; --rojo-bg:#fbe6e9;
    --gris:#5b6570; --gris-bg:#e7e9eb;
    --azul:#2563eb; --azul-bg:#e5edfd;
    --shadow:0 1px 2px rgba(20,22,30,.08), 0 1px 1px rgba(20,22,30,.05);
    --shadow-lg:0 12px 32px rgba(20,22,30,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--surface-2); color:var(--ink);}
  #app{display:flex; flex-direction:column; height:100%;}
  header{padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; z-index:1000;}
  header h1{font-size:15px; margin:0; font-weight:800; white-space:nowrap;}
  header .sub{font-size:11.5px; color:var(--ink-3); white-space:nowrap;}
  .search-box{flex:1; min-width:160px; position:relative;}
  #search{width:100%; padding:8px 12px; border-radius:18px; border:1px solid var(--border); font-size:13px; background:var(--surface-2); color:var(--ink);}
  #search-results{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); max-height:260px; overflow-y:auto; z-index:1001;}
  #search-results .sri{display:flex; gap:8px; align-items:center; padding:8px 11px; cursor:pointer; border-bottom:1px solid var(--border); font-size:12.5px;}
  #search-results .sri:last-child{border-bottom:none;}
  #search-results .sri:hover{background:var(--surface-2);}
  #search-results .sri .d{width:9px;height:9px;border-radius:50%;flex:none;}
  #btn-geo{flex:none; width:36px;height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--accent); display:flex; align-items:center; justify-content:center;}
  #btn-geo.on{background:var(--accent); color:#fff;}
  #filters{padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; gap:6px; overflow-x:auto; z-index:999;}
  .chip{flex:none; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); cursor:pointer; white-space:nowrap;}
  .chip b{font-weight:800; opacity:.7; margin-left:4px;}
  .chip.active{color:#fff;}
  .chip[data-f="todos"].active{background:var(--accent); border-color:var(--accent);}
  .chip[data-f="activo"].active{background:var(--verde); border-color:var(--verde);}
  .chip[data-f="recuperar"].active{background:var(--rojo); border-color:var(--rojo);}
  .chip[data-f="sincompra"].active{background:var(--gris); border-color:var(--gris);}
  .chip[data-f="visitado"].active{background:var(--azul); border-color:var(--azul);}
  .gmap-pin{background:none; border:none;}
  #map{flex:1; min-height:0; position:relative;}
  .leaflet-popup-content{margin:12px 14px; font-family:inherit; min-width:210px;}
  .pop-name{font-weight:800; font-size:14px; margin-bottom:4px;}
  .pop-badge{display:inline-block; font-size:10px; font-weight:800; padding:2px 9px; border-radius:20px; margin-bottom:8px;}
  .pop-row{display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:3px 0; border-bottom:1px solid var(--border); color:var(--ink-2);}
  .pop-row:last-of-type{border-bottom:none;}
  .pop-row b{color:var(--ink); font-weight:700;}
  .pop-actions{display:flex; gap:6px; margin-top:9px;}
  .pop-btn{flex:1; text-align:center; padding:7px 4px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:11px; font-weight:700; text-decoration:none; cursor:pointer;}
  .pop-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .pop-visit{display:block; width:100%; margin-top:7px; padding:6px; border-radius:8px; border:1px dashed var(--border); background:none; font-size:11px; font-weight:700; color:var(--ink-2); cursor:pointer; text-align:center;}
  .pop-visit.on{border-style:solid; border-color:var(--azul); color:var(--azul); background:var(--azul-bg);}
  #map-banner{position:absolute; top:10px; left:50%; transform:translateX(-50%); max-width:min(480px,92%); background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:10px; padding:9px 13px; font-size:12px; color:var(--ink-2); box-shadow:var(--shadow-lg); z-index:1002; line-height:1.5;}
  #map-banner.error{border-left-color:var(--rojo); color:var(--ink);}
  #map-banner button{display:block; margin:8px auto 0; padding:6px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-size:11.5px; font-weight:700; cursor:pointer;}
  #map-banner.error button{border-color:var(--rojo); background:var(--rojo);}
  #legend{position:absolute; left:10px; bottom:24px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 11px; font-size:11px; box-shadow:var(--shadow); z-index:998; line-height:1.7;}
  #legend .lg-dot{display:inline-block; width:9px;height:9px; border-radius:50%; margin-right:6px;}
  #footer-note{background:var(--surface); border-top:1px solid var(--border); padding:7px 14px; font-size:11px; color:var(--ink-3); text-align:center;}
  #footer-note a{color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MAP Clarios</h1>
    <span class="sub" id="hdr-count"></span>
    <div class="search-box">
      <input type="text" id="search" placeholder="Buscar cliente o RUC..." autocomplete="off">
      <div id="search-results" hidden></div>
    </div>
    <button id="btn-geo" title="Mi ubicación">◎</button>
  </header>
  <div id="filters">
    <button class="chip active" data-f="todos">Todos <b id="c-todos"></b></button>
    <button class="chip" data-f="activo">🟢 Activos <b id="c-activo"></b></button>
    <button class="chip" data-f="recuperar">🔴 Recuperar <b id="c-recuperar"></b></button>
    <button class="chip" data-f="sincompra">⚫ Sin compra <b id="c-sincompra"></b></button>
    <button class="chip" data-f="visitado">🔵 Visitados <b id="c-visitado"></b></button>
  </div>
  <div id="map"><div id="map-banner" hidden></div></div>
  <div id="footer-note">Mapa real (OpenStreetMap) — archivo independiente, sin integración con Cotizador/C&amp;C. Para cotizar o ver cartera, abre el Catálogo Clarios y busca al cliente por RUC.</div>
</div>

do": "activo", "listaAsignada": "B"}, {"id": "88313", "nombre": "BATERIAS CONDOR S.A.C.", "ruc": "20613422821", "lat": -12.20639, "lon": -76.95221667, "distrito": "VILLA EL SALVADOR", "departamento": "LIMA", "direccion": "SEC. GRUPO 21 A Mz M Lote 24", "ultimaCompraFecha": "2026-08-28", "dias": 10, "estado": "activo", "listaAsignada": "A"}, {"id": "88359", "nombre": "ESPINOZA BRITTO TRADING PERU", "ruc": "20612785130", "lat": -16.3913069, "lon": -71.58302712, "distrito": "MARIANO MELGAR", "departamento": "AREQUIPA", "direccion": "URB. SANTA RITA DE CASIA", "ultimaCompraFecha": "2026-06-27", "dias": 72, "estado": "activo", "listaAsignada": "A"}, {"id": "88411", "nombre": "CORPORACION DE SERVICIOS GEN", "ruc": "20609705591", "lat": -11.9818185, "lon": -77.09239852, "distrito": "SAN MARTIN DE PORRES", "departamento": "LIMA", "direccion": "URB. VIRGEN DEL ROSARIO Mz K Lote 17", "ultimaCompraFecha": "2026-08-11", "dias": 27, "estado": "activo", "listaAsignada": "B"}]</script>
<script>
(function(){
  var CLIENTES = JSON.parse(document.getElementById('clientes-map-data').textContent);
  var VISITA_DIAS = 21;

  function getVisitas(){ try{ return JSON.parse(localStorage.getItem('map_real_visitas')||'{}'); }catch(e){ return {}; } }
  function setVisitas(v){ try{ localStorage.setItem('map_real_visitas', JSON.stringify(v)); }catch(e){} }
  function estaVisitado(id){
    var v = getVisitas()[id];
    if(!v) return false;
    var dias = Math.round((Date.now()-new Date(v).getTime())/86400000);
    return dias>=0 && dias<=VISITA_DIAS;
  }
  function marcarVisitado(id){ var v=getVisitas(); v[id]=new Date().toISOString(); setVisitas(v); }
  function desmarcarVisitado(id){ var v=getVisitas(); delete v[id]; setVisitas(v); }
  function estadoFinal(c){ return estaVisitado(c.id) ? 'visitado' : c.estado; }

  var COLOR = { activo:'#1a8a4a', recuperar:'#d3273e', sincompra:'#111111', visitado:'#2563eb' };
  var LABEL = { activo:'Activo', recuperar:'A recuperar', sincompra:'Sin compra', visitado:'Visitado' };

  // Pin estilo Google Maps (gota con punta hacia abajo), coloreado según el
  // estado del cliente — pedido explícito del usuario: "debe verse como
  // Google Maps", no círculos planos.
  function pinIcon(color){
    var svg = '<svg width="14" height="20" viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" fill="'+color+'" stroke="#fff" stroke-width="2"/>'+
      '<circle cx="14" cy="14.5" r="5.5" fill="#fff"/>'+
      '</svg>';
    return L.divIcon({
      className: 'gmap-pin',
      html: svg,
      iconSize: [14,20],
      iconAnchor: [7,20],
      popupAnchor: [0,-18],
    });
  }

  document.getElementById('hdr-count').textContent = CLIENTES.length + ' clientes geolocalizados';

  var map = L.map('map', { zoomControl:true }).setView([-9.2, -75.0], 6);

  // El fondo del mapa (los "tiles") se pide a un servidor externo por cada
  // pedazo visible — si la red/firewall del equipo bloquea ese dominio, esas
  // imágenes no cargan aunque el resto de la página (pines, filtros, ficha)
  // funcione perfecto, porque eso sí está embebido en el archivo. Por eso se
  // prueban varios proveedores en cadena — si el primero falla, se pasa
  // automáticamente al siguiente — y si todos fallan se avisa en pantalla
  // en vez de dejar un fondo gris sin explicación.
  // Los servidores de OpenStreetMap (y sus espejos Wikimedia/.de/.fr) ahora
  // exigen que la app cumpla su política de uso (operations.osmfoundation.org/
  // policies/tiles/) y, si no, devuelven una imagen "Access blocked" en vez de
  // la calle — no es un error de red, por eso no se detectaba antes. Se usan
  // en su lugar dos proveedores gratuitos sin este requisito: Esri (mapa de
  // calles) y OpenTopoMap como respaldo.
  var TILE_PROVIDERS = [
    { name:'Esri World Street Map', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      attribution:'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom' },
    { name:'OpenTopoMap',           url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      attribution:'Map data: &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC-BY-SA</a>)' },
  ];
  var providerIdx = -1;
  var currentTileLayer = null;
  var tileErrorCount = 0;
  var tileLoadedOk = false;
  var providerTimer = null;

  function showMapBanner(html, isError){
    var b = document.getElementById('map-banner');
    b.innerHTML = html;
    b.className = isError ? 'error' : '';
    b.hidden = false;
  }
  function hideMapBanner(){
    document.getElementById('map-banner').hidden = true;
  }

  function tryNextProvider(){
    providerIdx++;
    if(currentTileLayer){ map.removeLayer(currentTileLayer); }
    if(providerTimer){ clearTimeout(providerTimer); }
    if(providerIdx >= TILE_PROVIDERS.length){
      showMapBanner(
        '⚠️ No se pudo cargar el fondo del mapa (se probaron '+TILE_PROVIDERS.length+' proveedores). '+
        'Los clientes SÍ están ubicados correctamente — es la imagen de calles la que no llega. '+
        'Muy probablemente tu red o firewall corporativo está bloqueando esos dominios. '+
        'Prueba abrir este mismo archivo desde otra red (datos móviles, por ejemplo), o pide a Sistemas que habilite acceso a *.arcgisonline.com y *.opentopomap.org. '+
        '<button type="button" id="map-banner-retry">Reintentar</button>',
        true
      );
      return;
    }
    tileErrorCount = 0;
    tileLoadedOk = false;
    var p = TILE_PROVIDERS[providerIdx];
    showMapBanner('Cargando el mapa de fondo… (' + p.name + ')', false);
    currentTileLayer = L.tileLayer(p.url, { maxZoom: 19, attribution: p.attribution });
    currentTileLayer.on('tileload', function(){
      tileLoadedOk = true;
      hideMapBanner();
      if(providerTimer){ clearTimeout(providerTimer); }
    });
    currentTileLayer.on('tileerror', function(){
      tileErrorCount++;
      if(tileErrorCount >= 6 && !tileLoadedOk) tryNextProvider();
    });
    currentTileLayer.addTo(map);
    // Si en 5s no cargó NI una tile y tampoco hubo errores (algunas redes
    // simplemente cuelgan la conexión en vez de devolver un error), se pasa
    // igual al siguiente proveedor.
    providerTimer = setTimeout(function(){
      if(!tileLoadedOk) tryNextProvider();
    }, 5000);
  }
  document.addEventListener('click', function(e){
    if(e.target && e.target.id==='map-banner-retry'){
      providerIdx = -1;
      tryNextProvider();
    }
  });
  tryNextProvider();

  var legend = L.control({position:'bottomleft'});
  legend.onAdd = function(){
    var div = L.DomUtil.create('div');
    div.id = 'legend';
    div.innerHTML =
      '<div><span class="lg-dot" style="background:'+COLOR.activo+'"></span>Activo</div>'+
      '<div><span class="lg-dot" style="background:'+COLOR.recuperar+'"></span>A recuperar</div>'+
      '<div><span class="lg-dot" style="background:'+COLOR.sincompra+'"></span>Sin compra</div>'+
      '<div><span class="lg-dot" style="background:'+COLOR.visitado+'"></span>Visitado</div>';
    return div;
  };
  legend.addTo(map);

  var markersById = {};
  var layerGroup = L.layerGroup().addTo(map);
  var currentFilter = 'todos';
  var bounds = [];

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function popupHtml(c){
    var est = estadoFinal(c);
    var visitado = estaVisitado(c.id);
    var diasTxt = c.dias==null ? 'Sin compras registradas' : (c.dias+' días sin comprar');
    return ''+
      '<div class="pop-name">'+esc(c.nombre)+'</div>'+
      '<span class="pop-badge" style="background:'+COLOR[est]+'22; color:'+COLOR[est]+';">'+LABEL[est].toUpperCase()+'</span>'+
      '<div class="pop-row"><span>RUC</span><b>'+esc(c.ruc||'—')+'</b></div>'+
      '<div class="pop-row"><span>Distrito</span><b>'+esc(c.distrito||'—')+'</b></div>'+
      '<div class="pop-row"><span>Última compra</span><b>'+(c.ultimaCompraFecha?c.ultimaCompraFecha.split('-').reverse().join('/'):'—')+'</b></div>'+
      '<div class="pop-row"><span>Estado</span><b>'+diasTxt+'</b></div>'+
      '<div class="pop-actions">'+
        '<a class="pop-btn primary" href="https://maps.google.com/?q='+c.lat+','+c.lon+'" target="_blank" rel="noopener">📍 Google Maps</a>'+
        '<a class="pop-btn" href="https://waze.com/ul?ll='+c.lat+'%2C'+c.lon+'&navigate=yes" target="_blank" rel="noopener">🚗 Waze</a>'+
      '</div>'+
      '<button type="button" class="pop-visit'+(visitado?' on':'')+'" data-vid="'+esc(c.id)+'">'+(visitado?'✓ Visitado — toca para deshacer':'Marcar como visitado hoy')+'</button>';
  }

  CLIENTES.forEach(function(c){
    var est = estadoFinal(c);
    var m = L.marker([c.lat, c.lon], { icon: pinIcon(COLOR[est]) });
    m.bindPopup(popupHtml(c));
    m.on('popupopen', function(){
      var btn = document.querySelector('.pop-visit[data-vid="'+c.id+'"]');
      if(btn) btn.addEventListener('click', function(){
        if(estaVisitado(c.id)) desmarcarVisitado(c.id); else marcarVisitado(c.id);
        refreshMarker(c);
        m.setPopupContent(popupHtml(c));
      });
    });
    markersById[c.id] = m;
    bounds.push([c.lat, c.lon]);
  });

  function refreshMarker(c){
    var est = estadoFinal(c);
    var m = markersById[c.id];
    m.setIcon(pinIcon(COLOR[est]));
  }

  function applyFilter(){
    layerGroup.clearLayers();
    CLIENTES.forEach(function(c){
      var est = estadoFinal(c);
      if(currentFilter!=='todos' && est!==currentFilter) return;
      layerGroup.addLayer(markersById[c.id]);
    });
    updateCounts();
  }
  function updateCounts(){
    var counts = { todos:CLIENTES.length, activo:0, recuperar:0, sincompra:0, visitado:0 };
    CLIENTES.forEach(function(c){ counts[estadoFinal(c)]++; });
    ['todos','activo','recuperar','sincompra','visitado'].forEach(function(k){
      var el = document.getElementById('c-'+k);
      if(el) el.textContent = counts[k];
    });
  }

  if(bounds.length) map.fitBounds(bounds, { padding:[30,30] });
  applyFilter();

  document.getElementById('filters').addEventListener('click', function(e){
    var btn = e.target.closest('.chip[data-f]');
    if(!btn) return;
    currentFilter = btn.dataset.f;
    document.querySelectorAll('.chip').forEach(function(b){ b.classList.toggle('active', b===btn); });
    applyFilter();
  });

  document.getElementById('btn-geo').addEventListener('click', function(){
    if(!navigator.geolocation){ alert('Este dispositivo no permite compartir ubicación.'); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      var latlng = [pos.coords.latitude, pos.coords.longitude];
      map.setView(latlng, 12);
      L.circleMarker(latlng, { radius:9, weight:3, color:'#fff', fillColor:'#202495', fillOpacity:1 }).addTo(map)
        .bindPopup('Tu ubicación').openPopup();
      document.getElementById('btn-geo').classList.add('on');
    }, function(){
      alert('No se pudo obtener tu ubicación. Revisa el permiso del navegador.');
    }, { enableHighAccuracy:true, timeout:8000 });
  });

  var searchInput = document.getElementById('search');
  var searchResults = document.getElementById('search-results');
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    if(q.length<2){ searchResults.hidden=true; return; }
    var matches = CLIENTES.filter(function(c){
      return (c.nombre&&c.nombre.toLowerCase().indexOf(q)>-1) || (c.ruc&&c.ruc.indexOf(q)>-1);
    }).slice(0,20);
    searchResults.innerHTML = !matches.length
      ? '<div class="sri" style="color:#838f96;">Sin resultados</div>'
      : matches.map(function(c){
          var est = estadoFinal(c);
          return '<div class="sri" data-sid="'+esc(c.id)+'"><span class="d" style="background:'+COLOR[est]+'"></span>'+
            '<span>'+esc(c.nombre)+'<br><span style="color:#838f96;">'+esc(c.distrito||'—')+' · '+LABEL[est]+'</span></span></div>';
        }).join('');
    searchResults.hidden = false;
  });
  searchResults.addEventListener('click', function(e){
    var item = e.target.closest('.sri[data-sid]');
    if(!item) return;
    var c = CLIENTES.find(function(x){ return x.id===item.dataset.sid; });
    if(c){
      map.setView([c.lat,c.lon], 15);
      markersById[c.id].openPopup();
    }
    searchResults.hidden = true;
    searchInput.value = '';
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.search-box')) searchResults.hidden = true;
  });
})();
</script>
</body>
</html>
